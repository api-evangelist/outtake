name: Outtake
description: 'Outtake is an AI-powered digital risk protection (DRP) platform that
  autonomously detects and dismantles digital threats — brand impersonation, executive
  impersonation, fake domains, fraudulent ads, and dark-web activity — across 100+
  platforms. Its agentic system combines an Entity Registry, Agentic Search, a Digital
  Reservoir of contextual intelligence, threat graphing / narrative intelligence,
  and adaptive takedown workflows to remove threats in hours rather than weeks. The
  company reports a 99.4% takedown-confirmation rate and a 14.4-hour average resolution
  time. Backed by CRV and ICONIQ Capital.'
